---

- hosts: all
  become: true
  tasks:
     
    - name: install update on ubuntu
      tags: always,update
      apt:
        update_cache: yes
      changed_when: false
      when: ansible_distribution == "Ubuntu"


 
- hosts: all
  become: true
  roles:
    - base



- hosts: web_servers
  become: true
  roles:
    -  web_servers
