---

- hosts: all
  become: true
  tasks:
    
    - name: update the repo
      tags: always
      apt:
        update_cache: yes
        upgrade: dist
        
      when: ansible_distribution_version == "24.04"

    - name: add kamo user
      tags: always
      user:
        name: akamo
        groups: root

    - name: add ssh key for akamo user
      tags: always
      authorized_key:
        user: akamo
        key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDoyJ1gDEbXyOGM1ryqFaR+OODHIlMyhVahvX3dCoVLF siham"

    - name: ad soduer file for akamo
      tags: always
      copy:
        src: akamo_sudoer
        dest: /etc/sudoers.d/akamo
        owner: root
        group: root
        mode: 0440
        
        

- hosts: web_servers
  become: true
  tasks:
 
    - name: install nginx and apache2 on a server and update ubuntu
      tags: apache2
      apt:
        name: 
          - apache2
          - libapache2-mod-php 
        state: latest
      when: ansible_distribution == "Ubuntu"

    - name: restart and enable appache service
      tags: apache2
      service:
        name: apache2
        state: started
        enabled: yes
      when: ansible_distribution == "Ubuntu"    
    - name: copy the index file to the server
      tags: apache2,ubuntu 
      copy:
        src: default.html
        dest: /var/www/html/index.html
        owner: root
        group: root
        mode: 0644
      when: ansible_distribution == "Ubuntu"
      
   
      
        

      
